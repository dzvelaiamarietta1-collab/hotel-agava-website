# The site is hand-edited HTML across four languages, so one slip lands in
# sixty files. This runs the same checks on every push, so a broken
# canonical or a price that disagrees with rooms-data is caught here
# rather than by Google a week later.
name: Validate site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2       # indexnow compares the push against the commit before it
      - uses: actions/setup-node@v4
        with:
          node-version: "20"        # rooms-data.js is read with node
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py

      # Bing and Yandex accept a push notification; ChatGPT answers are built
      # on the Bing index, so this is also how a new page becomes quotable.
      # Pull requests do not ping — only what is actually on main.
      - name: Tell IndexNow what changed
        if: github.event_name == 'push'
        run: python scripts/indexnow.py
